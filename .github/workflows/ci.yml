name: CI - Build & Push to ECR

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.16.0"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run unit tests (Jest)
      - name: Run Jest tests
        run: npm test -- --ci --watchAll=false
        env:
          CI: true

      # Run lint checks
      - name: Run lint
        run: npm run lint

      - name: Debug resolved ARN
        run: echo "Resolved ARN: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/air-max-270-github-actions-dev"

      # Configure AWS credentials (OIDC)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/air-max-270-github-actions-dev
          aws-region: us-east-1

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/air-max-270/landing-dev:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/air-max-270/landing-dev:latest
          registry: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

      # Save image reference for later jobs schedule
      - name: Set image env variable
        run: echo "IMAGE=$ECR_URI:$IMAGE_TAG" >> $GITHUB_ENV
