name: CI - Build & Push to ECR

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    permissions:
      id-token: write
      contents: write

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # - name: Node CI
      #   description: Setup Node.js, install deps, run tests and lint
      #   runs:
      #     using: "composite"
      #     steps:
      #       - uses: actions/setup-node@v4
      #         with:
      #           node-version: "20.16.0"
      #           cache: "npm"

      #       - run: npm ci
      #       - run: npm test -- --ci --watchAll=false
      #         env:
      #           CI: true
      #       - run: npm run lint

      - name: Node CI
        uses: ./.github/actions/node-ci
        with:
          node-version: "20.16.0"

      # # Setup Node.js
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "20.16.0"
      #     cache: "npm"

      # # Install dependencies
      # - name: Install dependencies
      #   run: npm ci

      # # Run unit tests (Jest)
      # - name: Run Jest tests
      #   run: npm test -- --ci --watchAll=false
      #   env:
      #     CI: true

      # # Run lint checks
      # - name: Run lint
      #   run: npm run lint

      # Debug ARN
      - name: Debug resolved ARN
        run: echo "Resolved ARN - arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/air-max-270-github-actions-dev"

      # Configure AWS credentials (OIDC)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/air-max-270-github-actions-dev
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/air-max-270/landing-dev:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/air-max-270/landing-dev:latest
          registry: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      # Save image reference for later jobs schedule
      - name: Set image env variable
        run: echo "IMAGE=$ECR_URI:$IMAGE_TAG" >> $GITHUB_ENV
