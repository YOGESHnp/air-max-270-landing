name: CI - Build & Push to ECR

on:
  push:
    branches:
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.16.0'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run unit tests (Jest)
      - name: Run Jest tests
        run: npm test -- --ci --watchAll=false
        env:
          CI: true

      # Run lint checks
      - name: Run lint
        run: npm run lint

      # Configure AWS credentials (OIDC)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::376129860198:role/air-max-270-github-actions-dev
          aws-region: us-east-1

      # Build Docker image
      - name: Build Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          ECR_URI=376129860198.dkr.ecr.us-east-1.amazonaws.com/air-max-270/landing-dev
          docker build -t $ECR_URI:$IMAGE_TAG -t $ECR_URI:latest .

      # Authenticate Docker to ECR
      - name: Login to ECR
        run: |
          ECR_URI=376129860198.dkr.ecr.us-east-1.amazonaws.com/air-max-270/landing-dev
          aws ecr get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin $ECR_URI

      # Push Docker image to ECR
      - name: Push Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          ECR_URI=376129860198.dkr.ecr.us-east-1.amazonaws.com/air-max-270/landing-dev
          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest

      # Save image reference for later jobs schedule
      - name: Set image env variable
        run: echo "IMAGE=$ECR_URI:$IMAGE_TAG" >> $GITHUB_ENV
